services:
  analyst:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEEPSEEK_THINKING: "0"
      CHROMA_PATH: /app/data/chroma
      SAMPLES_PATH: /app/data/samples
      REPORTS_PATH: /app/data/reports
      HF_HOME: /opt/hf-cache
      HF_HUB_CACHE: /opt/hf-cache/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
      EMBEDDING_MODEL: text-embedding-multilingual-e5-base
      EMBEDDING_API_KEY: lm-studio
      EMBEDDING_LOCAL_MODEL: /opt/models/multilingual-e5-base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma
      - reports_data:/app/data/reports
    restart: unless-stopped

volumes:
  chroma_data:
  reports_data:
