services:
  ouroboros:
    build:
      context: .
      dockerfile: docker/ouroboros.Dockerfile
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_COMPATIBLE_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_COMPATIBLE_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OUROBOROS_MODEL: ${OUROBOROS_MODEL:-openai-compatible::deepseek-v4-flash}
      OUROBOROS_MODEL_HEAVY: ${OUROBOROS_MODEL_HEAVY:-}
      OUROBOROS_MODEL_LIGHT: ${OUROBOROS_MODEL_LIGHT:-}
      OUROBOROS_MODEL_FALLBACKS: ${OUROBOROS_MODEL_FALLBACKS:-}
      OUROBOROS_REVIEW_MODELS: ${OUROBOROS_REVIEW_MODELS:-}
      OUROBOROS_RUNTIME_MODE: light
      OUROBOROS_TASK_REVIEW_MODE: off
      OUROBOROS_POST_TASK_EVOLUTION: "false"
      OUROBOROS_EFFORT_TASK: none
      OUROBOROS_RETURN_REASONING: "false"
      OUROBOROS_MAX_WORKERS: "1"
      OUROBOROS_WORKER_START_METHOD: spawn
      OUROBOROS_TRUST_NONLOCAL_BIND_WITHOUT_PASSWORD: "1"
      OUROBOROS_DATA_DIR: /data
      OUROBOROS_SKILLS_REPO_PATH: ""
      PYTHONPATH: /opt/analyst
      CHROMA_PATH: /data/chroma
      SAMPLES_PATH: /opt/analyst/data/samples
      REPORTS_PATH: /data/reports
      FORECAST_CACHE_PATH: /data/forecast_cache
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENROUTER_API_KEY}}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pr-drab-realization-91}
      LANGCHAIN_TRACING_V2: ${LANGSMITH_TRACING:-true}
      LANGCHAIN_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGSMITH_PROJECT:-pr-drab-realization-91}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # tini as PID 1 so workers' ppid is the Python server, not 1.
    # Without this, process_custody treats Docker PID 1 as an orphan and suicides.
    init: true
    volumes:
      - ouroboros_data:/data
      - chroma_data:/data/chroma
      - reports_data:/data/reports
      - forecast_cache:/data/forecast_cache
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
    restart: unless-stopped

  analyst:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OUROBOROS_URL: http://ouroboros:8765
      OUROBOROS_TURN_TIMEOUT_SEC: ${OUROBOROS_TURN_TIMEOUT_SEC:-300}
      CHROMA_PATH: /app/data/chroma
      SAMPLES_PATH: /app/data/samples
      REPORTS_PATH: /app/data/reports
      FORECAST_CACHE_PATH: /app/data/forecast_cache
      TOP_NEWS_CACHE_PATH: /app/data/top_news_cache
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENROUTER_API_KEY}}
      DEMO_LOGIN_USER: ${DEMO_LOGIN_USER:-}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
      DEMO_RATE_LIMIT_MAX: ${DEMO_RATE_LIMIT_MAX:-0}
      DEMO_RATE_LIMIT_WINDOW_SEC: ${DEMO_RATE_LIMIT_WINDOW_SEC:-3600}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pr-drab-realization-91}
      LANGCHAIN_TRACING_V2: ${LANGSMITH_TRACING:-true}
      LANGCHAIN_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGSMITH_PROJECT:-pr-drab-realization-91}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma
      - reports_data:/app/data/reports
      - forecast_cache:/app/data/forecast_cache
      - top_news_cache:/app/data/top_news_cache
    depends_on:
      ouroboros:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ouroboros_data:
  chroma_data:
  reports_data:
  forecast_cache:
  top_news_cache:
