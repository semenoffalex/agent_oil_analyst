services:
  ouroboros:
    build:
      context: .
      dockerfile: docker/ouroboros.Dockerfile
    env_file:
      - .env
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OUROBOROS_MODEL: ${OUROBOROS_MODEL:-z-ai/glm-5.2:free}
      OUROBOROS_MODEL_HEAVY: ${OUROBOROS_MODEL_HEAVY:-}
      OUROBOROS_MODEL_LIGHT: ${OUROBOROS_MODEL_LIGHT:-}
      OUROBOROS_MODEL_FALLBACKS: ${OUROBOROS_MODEL_FALLBACKS:-}
      OUROBOROS_REVIEW_MODELS: ${OUROBOROS_REVIEW_MODELS:-}
      OUROBOROS_RUNTIME_MODE: light
      OUROBOROS_TASK_REVIEW_MODE: off
      OUROBOROS_POST_TASK_EVOLUTION: "false"
      OUROBOROS_EFFORT_TASK: none
      OUROBOROS_RETURN_REASONING: "false"
      OUROBOROS_TRUST_NONLOCAL_BIND_WITHOUT_PASSWORD: "1"
      OUROBOROS_DATA_DIR: /data
      PYTHONPATH: /opt/analyst
      CHROMA_PATH: /data/chroma
      SAMPLES_PATH: /opt/analyst/data/samples
      REPORTS_PATH: /data/reports
      FORECAST_CACHE_PATH: /data/forecast_cache
      EMBEDDING_MODEL: /opt/models/multilingual-e5-base
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ouroboros_data:/data
      - chroma_data:/data/chroma
      - reports_data:/data/reports
      - forecast_cache:/data/forecast_cache
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
    restart: unless-stopped

  analyst:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OUROBOROS_URL: http://ouroboros:8765
      CHROMA_PATH: /app/data/chroma
      SAMPLES_PATH: /app/data/samples
      REPORTS_PATH: /app/data/reports
      FORECAST_CACHE_PATH: /app/data/forecast_cache
      HF_HOME: /opt/hf-cache
      HF_HUB_CACHE: /opt/hf-cache/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma
      - reports_data:/app/data/reports
      - forecast_cache:/app/data/forecast_cache
    depends_on:
      ouroboros:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ouroboros_data:
  chroma_data:
  reports_data:
  forecast_cache:
