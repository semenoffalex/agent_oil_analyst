# Example nginx front for the public Demo (ADR 0017).
# Tune rate= and burst= on the VPS; keep X-Forwarded-For for the app limiter.

limit_req_zone $binary_remote_addr zone=demo_analyst:10m rate=30r/h;

server {
    listen 80;
    server_name demo.example.com;

    location / {
        limit_req zone=demo_analyst burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
