[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-gas-analyst"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["oil_gas_analyst*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
